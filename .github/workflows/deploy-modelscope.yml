name: deploy-modelscope

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 自动创建魔搭 Docker 创空间（幂等，已存在则跳过）
        env:
          MS_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MS_STUDIO: ${{ secrets.MODELSCOPE_STUDIO }}
        if: ${{ env.MS_TOKEN != '' }}
        run: |
          SPACE_NAME="${MS_STUDIO##*/}"
          if git ls-remote "https://oauth2:$MS_TOKEN@www.modelscope.cn/studios/$MS_STUDIO.git" >/dev/null 2>&1; then
            echo "创空间已存在，跳过创建"
          else
            BODY='{"Name":"'"$SPACE_NAME"'","Path":"'"$SPACE_NAME"'","SdkType":"docker","Visibility":1,"DeployedByUser":true,"InstanceTypeName":"platform/2v-cpu-16g-mem","InstanceNumber":1,"DiskSize":50,"ExpiredMinutes":-1}'
            RESP=$(curl -s -X POST -H "Authorization: Bearer $MS_TOKEN" -H "Content-Type: application/json" -d "$BODY" "https://www.modelscope.cn/api/v1/studios")
            echo "$RESP"
            OK=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('Success'))" 2>/dev/null || echo False)
            if [ "$OK" != "True" ]; then
              echo "::error::创空间自动创建失败（若提示未绑定阿里云账号，请到魔搭账号设置绑定后重跑）"
              exit 1
            fi
            sleep 15
          fi

      - name: 推送到魔搭创空间（基于空间历史叠加，正常推送免force）
        env:
          MS_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MS_STUDIO: ${{ secrets.MODELSCOPE_STUDIO }}
          SANDBOX_CONFIG_JSON: ${{ secrets.SANDBOX_CONFIG_JSON }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          NOTIFY_URL: ${{ secrets.ALIPAY_NOTIFY_URL }}
        if: ${{ env.MS_TOKEN != '' }}
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git remote remove ms 2>/dev/null || true
          git remote add ms "https://oauth2:$MS_TOKEN@www.modelscope.cn/studios/$MS_STUDIO.git"
          git fetch ms master
          git checkout -B msdeploy FETCH_HEAD
          git checkout main -- .
          printf '%s' "$SANDBOX_CONFIG_JSON" > .alipay-sandbox.json
          if [ -n "$PUBLIC_BASE_URL" ]; then
            { echo "BASE_URL=$PUBLIC_BASE_URL"
              if [ -n "$NOTIFY_URL" ]; then echo "ALIPAY_NOTIFY_URL=$NOTIFY_URL"; fi
            } > env.production
          fi
          git add -A -f
          git commit -m "deploy: ${{ github.sha }}" || echo "no changes"
          git push ms HEAD:master
          echo "已推送，接下来触发创空间重建"

      - name: 触发魔搭创空间重建（推送不会自动重部署）
        env:
          MS_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MS_STUDIO: ${{ secrets.MODELSCOPE_STUDIO }}
        if: ${{ env.MS_TOKEN != '' }}
        run: |
          CODE=$(curl -s -o /tmp/deploy.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $MS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://modelscope.cn/openapi/v1/studios/$MS_STUDIO/deploy")
          echo "deploy api HTTP $CODE"
          cat /tmp/deploy.json 2>/dev/null || true
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "::warning::自动触发重建失败（HTTP $CODE），请在创空间页面手动点 Redeploy"
          fi
